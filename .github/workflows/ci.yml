name: BookMyScreen CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bms-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: bms-frontend
        run: npm ci

      - name: Build frontend
        working-directory: bms-frontend
        run: npm run build
